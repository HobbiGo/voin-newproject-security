<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIN Web4 Dashboard</title>
<style>
  :root { --bg:#0b1020; --card:#111a2e; --fg:#e6edf3; --acc:#4ade80; --border:#1f2a44; --muted:#94a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg); color: var(--fg); font-family: ui-monospace, monospace; padding: 20px; display: flex; justify-content: center; }
  .dashboard { width: 100%; max-width: 800px; }
  
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { color: var(--acc); font-size: 24px; margin-bottom: 5px; }
  .header p { color: var(--muted); font-size: 12px; }

  .balance-card { background: linear-gradient(135deg, #111a2e, #1a243b); border: 1px solid var(--border); padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; }
  .balance-info h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .balance-info h2 { font-size: 36px; color: #fff; }
  .balance-info span { color: var(--acc); font-size: 18px; }
  .nonce-info { text-align: right; font-size: 12px; color: var(--muted); }
  .nonce-info strong { color: #fff; display: block; font-size: 16px; margin-top: 5px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h3 { font-size: 14px; margin-bottom: 15px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

  input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-family: inherit; }
  button { width: 100%; background: var(--acc); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:hover { opacity: 0.8; }

  .chat-box { height: 200px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 12px; }
  .msg-user { color: var(--muted); text-align: right; margin-bottom: 8px; }
  .msg-ai { color: var(--acc); margin-bottom: 8px; }
</style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <h1>🌐 VOIN WEB4 DASHBOARD</h1>
    <p>Terhubung ke VOIN CORE & AI ENGINE</p>
  </div>

  <div class="balance-card">
    <div class="balance-info">
      <h3>Total Saldo Dompet</h3>
      <h2 id="saldoTampil">Memuat...</h2>
    </div>
    <div class="nonce-info">
      Status Jaringan<br>
      <strong>● AKTIF</strong>
      Nonce: <span id="nonceTampil">-</span>
    </div>
  </div>

  <div class="grid">
    <!-- Form Transfer -->
    <div class="card">
      <h3>💸 Transfer VOIN</h3>
      <input type="text" id="recipient" placeholder="Alamat Penerima (Recipient)">
      <input type="number" id="amount" placeholder="Jumlah (Amount)" value="100">
      <input type="number" id="fee" placeholder="Biaya (Fee)" value="1">
      <input type="number" id="nonceInput" placeholder="Nonce" value="6">
      <button onclick="kirimTransfer()">Kirim Transaksi</button>
    </div>

    <!-- AI Chat -->
    <div class="card">
      <h3>🧠 VOIN AI Assistant</h3>
      <div class="chat-box" id="chatBox">
        <div class="msg-ai">[AI]: Halo! Saya siap membantu. Anda bisa bertanya tentang saldo atau keamanan.</div>
      </div>
      <input type="text" id="chatInput" placeholder="Tanya AI..." onkeypress="if(event.key==='Enter') kirimChat()">
      <button onclick="kirimChat()" style="background: #1f2a44; color: #fff;">Kirim Pesan AI</button>
    </div>
  </div>
</div>

<script>
  // Karena UI dan API sekarang ada di port yang sama, kita bisa pakai origin langsung
  var apiBase = window.location.origin;

  async function muatSaldo() {
    try {
      const response = await fetch(apiBase + '/api/balance');
      const data = await response.json();
      if (data.success) {
        document.getElementById('saldoTampil').innerHTML = data.balance + ' <span>VOIN</span>';
        document.getElementById('nonceTampil').innerText = data.nonce;
        document.getElementById('nonceInput').value = Number(data.nonce) + 1;
      } else {
        document.getElementById('saldoTampil').innerText = "Akun tidak ditemukan";
      }
    } catch (e) {
      document.getElementById('saldoTampil').innerText = "Error Koneksi";
    }
  }

  async function kirimChat() {
    var input = document.getElementById("chatInput");
    var chatBox = document.getElementById("chatBox");
    var teks = input.value;
    if (teks === "") return;

    chatBox.innerHTML += "<div class='msg-user'>[User]: " + teks + "</div>";
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const response = await fetch(apiBase + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: teks })
      });
      const data = await response.json();
      chatBox.innerHTML += "<div class='msg-ai'>" + data.reply + "</div>";
      chatBox.scrollTop = chatBox.scrollHeight;
    } catch (e) {
      chatBox.innerHTML += "<div class='msg-ai' style='color:red;'>[Error]: Koneksi terputus.</div>";
    }
  }

  async function kirimTransfer() {
    var recipient = document.getElementById("recipient").value;
    var amount = document.getElementById("amount").value;
    var fee = document.getElementById("fee").value;
    var nonce = document.getElementById("nonceInput").value;
    
    // Minta PIN (Simulasi Keamanan)
    var pin = prompt("Masukkan PIN Anda (Demo: securePin999):");

    if (!pin) return alert("Transaksi dibatalkan.");
    if (!recipient) return alert("Alamat penerima harus diisi!");

    try {
      const response = await fetch(apiBase + '/api/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipient, amount, fee, nonce, pin })
      });
      
      const data = await response.json();
      
      if (data.success) {
        alert("✅ " + data.message);
        muatSaldo(); // Refresh saldo secara otomatis
      } else {
        alert("❌ Gagal: " + data.message);
      }
    } catch (error) {
      alert("❌ Koneksi terputus ke Node.js.");
    }
  }

  // Muat saldo saat halaman dibuka
  muatSaldo();
</script>

</body>
</html>
