<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>VOIN AI ENGINE V1.0</title>
<style>
  body { background-color: #0b1020; color: white; font-family: monospace; padding: 20px; display: flex; justify-content: center; }
  .box { width: 100%; max-width: 500px; background: #111a2e; padding: 20px; border-radius: 10px; border: 1px solid #1f2a44; }
  .chat { height: 300px; border: 1px solid #1f2a44; padding: 10px; overflow-y: auto; margin-bottom: 10px; background: #0b1020; border-radius: 5px; }
  .msg-ai { color: #4ade80; margin-bottom: 10px; }
  .msg-user { color: #e6edf3; text-align: right; margin-bottom: 10px; }
  .input-area { display: flex; gap: 10px; }
  input { flex: 1; padding: 10px; background: #0b1020; color: white; border: 1px solid #1f2a44; border-radius: 5px; }
  button { padding: 10px 20px; background: #4ade80; color: black; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<div class="box">
  <h3>🧠 VOIN AI ENGINE V1.0 (Terhubung ke Node.js)</h3>
  <div class="chat" id="chatBox">
    <div class="msg-ai">[AI]: Halo! Saya terhubung ke API VOIN. Ketik "saldo", "keamanan", atau "kirim".</div>
  </div>
  <div class="input-area">
    <input type="text" id="inputUser" placeholder="Ketik pesan...">
    <button onclick="kirimPesan()">Kirim</button>
  </div>
</div>

<script>
  async function kirimPesan() {
    var input = document.getElementById("inputUser");
    var chatBox = document.getElementById("chatBox");
    var teks = input.value;

    if (teks === "") return;

    // Tampilkan pesan user
    chatBox.innerHTML += "<div class='msg-user'>[User]: " + teks + "</div>";
    input.value = "";

    // Tampilkan status loading
    var loadingId = "loading-" + Date.now();
    chatBox.innerHTML += "<div class='msg-ai' id='" + loadingId + "'>[AI]: Sedang menganalisis...</div>";
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      // TRIK CODESPACES: Mengubah localhost menjadi URL Codespaces secara otomatis
      var host = window.location.host;
      var apiUrl = "https://" + host.replace(/-33079\./, '-3000.') + "/api/chat";

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: teks })
      });
      
      const data = await response.json();
      
      // Hapus teks loading dan ganti dengan balasan asli
      document.getElementById(loadingId).remove();
      chatBox.innerHTML += "<div class='msg-ai'>" + data.reply + "</div>";
      chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {
      document.getElementById(loadingId).remove();
      chatBox.innerHTML += "<div class='msg-ai' style='color:red;'>[Error]: Gagal terhubung ke server Node.js. Pastikan server menyala.</div>";
    }
  }
</script>

</body>
</html>
